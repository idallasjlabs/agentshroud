version: 2
updates:
  - package-ecosystem: pip
    directory: /gateway
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # presidio-anonymizer 2.2.364 narrowed its own cryptography constraint to
      # <49.0.0,>=48.0.1 (2.2.362 was cryptography>=46.0.4, no upper bound),
      # which conflicts with this repo's cryptography>=50.0.0 security floor
      # (gateway/requirements.txt) — every CI job fails at pip install before
      # any test runs. Nothing in 2.2.363/2.2.364's changelog is a security fix
      # that would justify relaxing the floor, so pin this version out
      # specifically rather than the whole dependency, so a future release
      # that fixes the constraint can still be proposed normally.
      - dependency-name: "presidio-anonymizer"
        versions: ["2.2.364"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
