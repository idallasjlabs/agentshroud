name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  image-signing:
    name: Image Signing & Provenance (cosign)
    runs-on: ubuntu-latest
    # Signing requires OIDC + registry push, which only exist on push to main.
    # Every step fails hard: a green job means the image was built, pushed,
    # signed, and its SBOM attested — no soft-fail theater (IEC 62443 FR3/SL3).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2 (no floating v4 tag exists)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway Image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }} -f gateway/Dockerfile .

      - name: Push Gateway Image
        run: docker push ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

      - name: Sign Gateway Image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

      - name: Generate SBOM with syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }} \
            -o spdx-json > sbom-gateway.json

      - name: Attest SBOM with cosign
        run: |
          cosign attest --yes --predicate sbom-gateway.json --type spdxjson \
            ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

  # Inbound MCP Edge image (SCRUM-215/217): the one internet-facing container.
  # Unlike the gateway's informational fs scan, every gate here can fail:
  #   1. the shipped tool-descriptor manifest must carry a valid owner signature
  #      and match the code (an unsigned or drifted manifest fails the job);
  #   2. the image must build and its entry module must import;
  #   3. Trivy IMAGE scan, fixable CRITICAL/HIGH => exit 1;
  #   4. on push to main: push to GHCR, cosign keyless-sign the pushed DIGEST,
  #      then `cosign verify` that digest against this workflow's identity.
  # IEC 62443: FR3 (System Integrity) SL3.
  edge-image:
    name: MCP Edge Image (build, Trivy gate, cosign)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      EDGE_LOCAL_TAG: agentshroud-mcp-edge:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # descriptors.py needs only `cryptography`; pinned to gateway/requirements.lock.
      - name: Verify signed tool-descriptor manifest
        run: |
          pip install "cryptography==50.0.2"
          python -c "from gateway.inbound_edge.descriptors import verify_shipped_descriptors; verify_shipped_descriptors()"

      - name: Build edge image
        run: docker build -t "$EDGE_LOCAL_TAG" -f docker/mcp-edge/Dockerfile --build-arg AGENTSHROUD_GIT_SHA=${{ github.sha }} .

      - name: Edge entry module imports inside the image
        run: docker run --rm --network none --entrypoint python "$EDGE_LOCAL_TAG" -c "import gateway.inbound_edge.edge_app"

      - name: Trivy image scan (fixable CRITICAL/HIGH fail the job)
        # Same immutable, verified commit as trivy-scan below (see the note there).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.EDGE_LOCAL_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 (no floating v4 tag exists)

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push edge image and resolve its digest
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/agentshroud-mcp-edge:${{ github.sha }}"
          docker tag "$EDGE_LOCAL_TAG" "$REF"
          docker push "$REF"
          # RepoDigests also lists the local build tag's digest, in no fixed
          # order, so pick the entry for the repository we just pushed to.
          REPO="${REF%:*}"
          DIGEST_REF="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REF" | grep -m1 "^${REPO}@sha256:" || true)"
          case "$DIGEST_REF" in
            "${REPO}"@sha256:*) ;;
            *) echo "could not resolve pushed digest (got '$DIGEST_REF')" >&2; exit 1 ;;
          esac
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Sign edge image digest with cosign (keyless OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.push.outputs.digest_ref }}"

      - name: Verify edge image signature (identity = this workflow on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/security-scan.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.push.outputs.digest_ref }}" > /dev/null

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        # Pinned to an immutable, GPG-verified commit (not @master) after the
        # 2026-03 TeamPCP supply-chain attack force-pushed malicious content to
        # trivy tags. Verify before bumping: `gh api repos/aquasecurity/trivy-action/commits/<sha>
        # --jq .commit.verification` must show verified:true for a maintainer signature.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          # .gitallowed contains dummy credential patterns for git-secrets allowlisting,
          # not real secrets. Skip it to prevent false-positive secret alerts.
          skip-files: ".gitallowed"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST (IEC 62443 4-1 SDL)
    runs-on: ubuntu-latest
    # Until 2026-09-20 Semgrep ran in NO pipeline at all: declared in
    # .pre-commit-config.yaml but no pre-commit hook was installed (a bare
    # `git secrets --install` had displaced .git/hooks/pre-commit),
    # scripts/security-scan.sh warn-skipped it when the binary was absent, and
    # .github/PULL_REQUEST_TEMPLATE.md asked authors to attest "Semgrep passes"
    # via a command that could not run. CLAUDE.md section 7 constraint 5
    # requires new code to pass .semgrep.yml; this job makes that enforced
    # rather than attested.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # --baseline-commit needs history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Keep in step with the semgrep provided by flake.nix devTools, so
      # `pre-commit run semgrep` locally and this job cannot disagree.
      # Bumped 1.60.1 -> 1.177.0 on 2026-09-20: 1.60.1 was past upstream EOL
      # (semgrep.dev supports >= 1.76.0 and the CLI warned on every run).
      # Verified before landing — 1.177.0 returns the identical finding set on
      # gateway/ (136: 131 WARNING / 5 ERROR) and the baselined gate below
      # still exits 0, so the bump changes enforcement not at all.
      - name: Install semgrep
        run: pip install semgrep==1.177.0

      # THE GATE: fail on findings this change INTRODUCES.
      # gateway/ carries 136 pre-existing findings (131 WARNING / 5 ERROR,
      # measured 2026-09-20), so an unbaselined `--error` run exits 1 on every
      # PR. The only ways to land that are to clear the backlog first or make
      # the job non-blocking — and a non-blocking security gate is exactly the
      # soft-fail theater CLAUDE.md 0.0 forbids. --baseline-commit enforces
      # precisely what constraint 5 states ("NEW code must pass") and still
      # fails hard, so the gate means something from day one.
      - name: Semgrep — no new findings vs baseline
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "Baseline commit: $BASE"
          semgrep scan --config .semgrep.yml --error --quiet \
            --baseline-commit "$BASE" gateway/

      # The backlog stays VISIBLE. Baselining debt without publishing the
      # number is how it becomes invisible; this step prints it every run so
      # a rising count is noticed. Informational by design — the gate above is
      # what blocks.
      - name: Pre-existing finding count (informational)
        if: always()
        run: |
          semgrep scan --config .semgrep.yml --json --quiet gateway/ > semgrep-all.json || true
          python3 -c "
          import json, collections
          r = json.load(open('semgrep-all.json')).get('results', [])
          sev = collections.Counter(x['extra'].get('severity') for x in r)
          print(f'Pre-existing .semgrep.yml findings in gateway/: {len(r)}')
          for k, v in sorted(sev.items()):
              print(f'  {k}: {v}')
          "

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Upgrade pip to latest
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r gateway/requirements.txt

      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit.json || true

      - name: Check for critical vulnerabilities
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('pip-audit.json'))
          vulns = data.get('dependencies', [])
          critical = [v for v in vulns if v.get('vulns')]
          if critical:
              print(f'Found {len(critical)} vulnerable packages')
              for pkg in critical:
                  print(f\"  {pkg['name']} {pkg['version']}: {len(pkg['vulns'])} vulns\")
              sys.exit(1)
          print('No vulnerabilities found')
          "
