name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  image-signing:
    name: Image Signing & Provenance (cosign)
    runs-on: ubuntu-latest
    # Signing requires OIDC + registry push, which only exist on push to main.
    # Every step fails hard: a green job means the image was built, pushed,
    # signed, and its SBOM attested — no soft-fail theater (IEC 62443 FR3/SL3).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway Image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }} -f gateway/Dockerfile .

      - name: Push Gateway Image
        run: docker push ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

      - name: Sign Gateway Image with cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

      - name: Generate SBOM with syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }} \
            -o spdx-json > sbom-gateway.json

      - name: Attest SBOM with cosign
        run: |
          cosign attest --yes --predicate sbom-gateway.json --type spdxjson \
            ghcr.io/${{ github.repository_owner }}/agentshroud-gateway:${{ github.sha }}

  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        # Pinned to an immutable, GPG-verified commit (not @master) after the
        # 2026-03 TeamPCP supply-chain attack force-pushed malicious content to
        # trivy tags. Verify before bumping: `gh api repos/aquasecurity/trivy-action/commits/<sha>
        # --jq .commit.verification` must show verified:true for a maintainer signature.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          # .gitallowed contains dummy credential patterns for git-secrets allowlisting,
          # not real secrets. Skip it to prevent false-positive secret alerts.
          skip-files: ".gitallowed"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep SAST (IEC 62443 4-1 SDL)
    runs-on: ubuntu-latest
    # Until 2026-09-20 Semgrep ran in NO pipeline at all: declared in
    # .pre-commit-config.yaml but no pre-commit hook was installed (a bare
    # `git secrets --install` had displaced .git/hooks/pre-commit),
    # scripts/security-scan.sh warn-skipped it when the binary was absent, and
    # .github/PULL_REQUEST_TEMPLATE.md asked authors to attest "Semgrep passes"
    # via a command that could not run. CLAUDE.md section 7 constraint 5
    # requires new code to pass .semgrep.yml; this job makes that enforced
    # rather than attested.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # --baseline-commit needs history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Keep in step with the semgrep provided by flake.nix devTools, so
      # `pre-commit run semgrep` locally and this job cannot disagree.
      # Bumped 1.60.1 -> 1.177.0 on 2026-09-20: 1.60.1 was past upstream EOL
      # (semgrep.dev supports >= 1.76.0 and the CLI warned on every run).
      # Verified before landing — 1.177.0 returns the identical finding set on
      # gateway/ (136: 131 WARNING / 5 ERROR) and the baselined gate below
      # still exits 0, so the bump changes enforcement not at all.
      - name: Install semgrep
        run: pip install semgrep==1.177.0

      # THE GATE: fail on findings this change INTRODUCES.
      # gateway/ carries 136 pre-existing findings (131 WARNING / 5 ERROR,
      # measured 2026-09-20), so an unbaselined `--error` run exits 1 on every
      # PR. The only ways to land that are to clear the backlog first or make
      # the job non-blocking — and a non-blocking security gate is exactly the
      # soft-fail theater CLAUDE.md 0.0 forbids. --baseline-commit enforces
      # precisely what constraint 5 states ("NEW code must pass") and still
      # fails hard, so the gate means something from day one.
      - name: Semgrep — no new findings vs baseline
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "Baseline commit: $BASE"
          semgrep scan --config .semgrep.yml --error --quiet \
            --baseline-commit "$BASE" gateway/

      # The backlog stays VISIBLE. Baselining debt without publishing the
      # number is how it becomes invisible; this step prints it every run so
      # a rising count is noticed. Informational by design — the gate above is
      # what blocks.
      - name: Pre-existing finding count (informational)
        if: always()
        run: |
          semgrep scan --config .semgrep.yml --json --quiet gateway/ > semgrep-all.json || true
          python3 -c "
          import json, collections
          r = json.load(open('semgrep-all.json')).get('results', [])
          sev = collections.Counter(x['extra'].get('severity') for x in r)
          print(f'Pre-existing .semgrep.yml findings in gateway/: {len(r)}')
          for k, v in sorted(sev.items()):
              print(f'  {k}: {v}')
          "

  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Upgrade pip to latest
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r gateway/requirements.txt

      - name: Run pip-audit
        run: pip-audit --format=json --output=pip-audit.json || true

      - name: Check for critical vulnerabilities
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('pip-audit.json'))
          vulns = data.get('dependencies', [])
          critical = [v for v in vulns if v.get('vulns')]
          if critical:
              print(f'Found {len(critical)} vulnerable packages')
              for pkg in critical:
                  print(f\"  {pkg['name']} {pkg['version']}: {len(pkg['vulns'])} vulns\")
              sys.exit(1)
          print('No vulnerabilities found')
          "
