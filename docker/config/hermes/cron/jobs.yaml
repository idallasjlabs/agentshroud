#
# Hermes Agent scheduled jobs — seeded from AgentShroud defaults on first boot.
# Mirrors OpenClaw's job set (docker/config/openclaw/cron/jobs.json) adapted for
# Hermes' YAML format. Hermes reads this from /opt/data/cron/jobs.yaml.
#
# Job format: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

jobs:
  - name: "AgentShroud Daily Check-in"
    enabled: true
    schedule: "0 14 * * *"
    timezone: "America/New_York"
    notify: true
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      Daily AgentShroud check-in from Hermes Agent. Report:
      1) Current date and time.
      2) A brief status of any tasks you have been working on.
      3) Anything noteworthy from conversations today.
      Keep it under 150 words and send to Isaiah via Telegram.

  - name: "AgentShroud Weekly Summary"
    enabled: true
    schedule: "0 18 * * 5"
    timezone: "America/New_York"
    notify: true
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      Weekly summary from Hermes Agent. Compile:
      1) Key topics discussed this week.
      2) Skills learned or created.
      3) What to focus on next week.
      Format concisely and send to Isaiah via Telegram.

  - name: "Weekly Kaizen Review"
    enabled: true
    schedule: "0 17 * * 5"
    timezone: "America/New_York"
    notify: true
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      It's Friday 5 PM — weekly kaizen review (Hermes Agent perspective).
      What shipped this week? What caused friction? What process improvements
      would have the most impact for our AgentShroud development workflow?
      Format as: SHIPPED / FRICTION / IMPROVE. Be specific and actionable.

  - name: "Monthly Chaos Engineering Drill"
    enabled: true
    schedule: "0 9 1 * *"
    timezone: "America/New_York"
    notify: true
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      First of the month — chaos engineering drill (Hermes Agent perspective).
      Simulate one realistic failure scenario for AgentShroud that involves
      the Hermes bot specifically. Choose from: gateway crash, volume corruption,
      bot disconnect, or dependency outage. Describe the failure mode, detection
      method, expected blast radius, and recovery procedure. Keep it concise.

  - name: "Daily Memory Journal"
    enabled: true
    schedule: "55 23 * * *"
    timezone: "America/New_York"
    notify: false
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      Nightly memory consolidation for Hermes Agent. Summarize the day:
      active projects, pending tasks, decisions made by the owner, and key
      facts to maintain continuity. Store in memory/context. Silent operation.

  - name: "AI Security Standards Tracker"
    enabled: true
    schedule: "0 9 * * 1"
    timezone: "America/New_York"
    notify: true
    delivery:
      channel: telegram
    message: >
      Search the web for AI security standard publications or updates from the
      past 7 days. Prioritize: NIST AI Agent Standards Initiative, CSA MAESTRO
      revisions, OWASP Agentic AI Top 10 (ASI) updates, EU AI Act delegated acts
      or technical guidance, ISO 42001 amendments, MITRE ATLAS new techniques, and
      Singapore MAS autonomous agent framework updates. For each finding, state
      the standard name, what changed, and the specific AgentShroud control layer
      (PromptGuard / EgressFilter / ToolACL / ApprovalQueue / AuditChain) that
      addresses it, or note a gap if none does. Report via Telegram as concise
      bullet points only. If nothing new this week, say so in one line.

  - name: "Agentic AI CVE and Exploit Watch"
    enabled: true
    schedule: "0 10 * * 4"
    timezone: "America/New_York"
    notify: true
    delivery:
      channel: telegram
    message: >
      Search NVD, GitHub Security Advisories, and security research blogs for new
      CVEs or proof-of-concept exploits targeting AI agent frameworks published in
      the last 7 days. Flag anything that affects Hermes Agent (nousresearch),
      OpenClaw, or the underlying dependencies they use. For each finding include:
      CVE ID if assigned, affected component, CVSS score if available, and whether
      AgentShroud's gateway already mitigates it (cite the specific module). Report
      via Telegram as bullet points only. If nothing new this week, say so briefly.

  - name: "Weekly Hermes Stability Report"
    enabled: true
    schedule: "0 9 * * 1"
    timezone: "America/New_York"
    notify: true
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: telegram
    message: >
      Read /opt/data/logs/gateway-exit-diag.log (last 7 days) and
      /opt/data/.start-history. Compute: total restarts, crashes per day
      (sparkline), longest stable window in hours, top 3 exit codes, and any
      backoff pauses triggered. Format as "Hermes Weekly Stability — <date range>"
      in under 200 words. Send via Telegram. If log files do not exist, report
      that Hermes has been stable with no recorded exits this week.

  - name: "Hermes Competitive Landscape Update (AM/PM)"
    enabled: true
    schedule: "0 6,15 * * *"
    timezone: "America/New_York"
    notify: false
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: local
    message: >
      Read /opt/data/workspace/competitive-analysis.md for research instructions.
      Execute the full 4-section competitive intelligence report with zero
      hallucinations — every claim verified against a live primary source with URL.
      Save as /opt/data/workspace/reports/competitive-report-YYYY-MM-DD.md and
      append a one-line summary to /opt/data/workspace/reports/trend-log.md.
      Do NOT send any email — the separate "Hermes Competitive Intelligence
      Email" cron job handles delivery.
      Silence is correct if nothing new; hallucination is a critical failure.

  - name: "jira-weekly-review"
    enabled: true
    schedule: "0 9 * * 0"
    timezone: "America/New_York"
    notify: false
    delivery:
      channel: local
    message: >
      Sunday 09:00 — SCRUM-81 weekly Jira review. Run the pre-committed posting
      script exactly: python3 /opt/data/workspace/jira_weekly_review.py
      It fetches the Atlassian token/email/domain from the gateway op-proxy,
      builds a weekly summary (commits + SCRUM items advanced + a staleness flag),
      and posts it as a real authenticated comment on SCRUM-81 via the Atlassian
      REST API. This keeps the account non-idle. NEVER use execute_code,
      python3 -c, pip install, or uv pip install — run the committed script only.
      Do NOT write your own script. Expect exit code 0. If it exits non-zero,
      report the full stderr via Telegram.

  - name: "Hermes Competitive Intelligence Email (AM/PM)"
    enabled: true
    schedule: "0 7,16 * * *"
    timezone: "America/New_York"
    notify: false
    model: gemma-4-26b-a4b-it
    model_provider: ollama
    delivery:
      channel: local
    message: >
      Read the most recent competitive-report-*.md from
      /opt/data/workspace/reports/ (prefer today's date).
      If no report exists, write body "No significant changes detected today."
      To render: a pre-installed renderer is baked into the image.
      The renderer converts the Markdown report to HTML with inline styles
      for email client compatibility (white bg #ffffff, text #111111, links #1a73e8).
      Run it with the report file and output path as positional arguments:
      python3 /usr/local/lib/agentshroud/render_md_email.py
        <path-to-report.md> /tmp/competitive-email.html
      Do NOT write your own renderer script — use the pre-installed one only.
      NEVER use execute_code, python3 -c, pip install, or uv pip install — all
      are blocked in cron mode. The final .html output at /tmp/ is fine.
      Then send it using ALL THREE flags — this is mandatory, not optional.
      EXACT command to run:
      /usr/local/bin/agentshroud-email-send.sh
      --html
      --subject "AgentShroud Hermes Competitive Intelligence — $(date +%Y-%m-%d)"
      --body-file /tmp/competitive-email.html
      Expect HTTP 200 from the gateway. If the send fails, report the full error
      output via Telegram.
