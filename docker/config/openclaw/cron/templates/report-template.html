<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>{{REPORT_TITLE}} — AgentShroud™</title>
<style>
  :root { color-scheme: dark; supported-color-schemes: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: #000000;
    color: #e8e8e8;
    line-height: 1.6;
    padding: 0;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #000000;
  }
  .header {
    background: linear-gradient(135deg, #0d4f8f 0%, #1583f0 100%);
    padding: 32px 40px;
    text-align: center;
    border-bottom: 3px solid #4da6ff;
  }
  .header img {
    width: 64px;
    height: 64px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
  .header .tagline {
    font-size: 12px;
    color: #b0d4ff;
    margin-top: 4px;
    font-style: italic;
  }
  .meta-bar {
    background: #0d4f8f;
    padding: 12px 40px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #b0d4ff;
  }
  .meta-bar .report-type {
    font-weight: 600;
    color: #4da6ff;
  }
  .content {
    padding: 32px 40px;
  }
  h2 {
    color: #4da6ff;
    font-size: 18px;
    font-weight: 600;
    margin: 28px 0 12px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #2a2a4e;
  }
  h2:first-child { margin-top: 0; }
  h3 {
    color: #1583f0;
    font-size: 15px;
    font-weight: 600;
    margin: 20px 0 8px 0;
  }
  p { margin: 8px 0; color: #e8e8e8; font-size: 14px; }
  ul, ol { margin: 8px 0 8px 24px; }
  li { margin: 4px 0; font-size: 14px; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 13px;
  }
  th {
    background: #0d4f8f;
    color: #ffffff;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid #2a2a4e;
    color: #e8e8e8;
  }
  tr:nth-child(even) td { background: rgba(21, 131, 240, 0.06); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-success { background: #28a745; color: #fff; }
  .badge-warning { background: #ffc107; color: #000000; }
  .badge-danger { background: #dc3545; color: #fff; }
  .badge-info { background: #1583f0; color: #fff; }
  .callout {
    border-left: 4px solid #1583f0;
    background: rgba(21, 131, 240, 0.08);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 0 4px 4px 0;
  }
  .callout-warning { border-left-color: #ffc107; background: rgba(255, 193, 7, 0.08); }
  .callout-danger { border-left-color: #dc3545; background: rgba(220, 53, 69, 0.08); }
  .callout-success { border-left-color: #28a745; background: rgba(40, 167, 69, 0.08); }
  .footer {
    background: #0d4f8f;
    padding: 20px 40px;
    text-align: center;
    font-size: 11px;
    color: #7ab3e0;
    border-top: 1px solid #2a2a4e;
  }
  .footer a { color: #4da6ff; text-decoration: none; }
  .footer .tm { margin-top: 8px; font-size: 10px; }
  code {
    background: rgba(21, 131, 240, 0.15);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    color: #4da6ff;
  }
  pre {
    background: #0a0a0a;
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 12px 0;
    font-size: 13px;
    color: #e8e8e8;
    border: 1px solid #1f1f1f;
  }
  .divider { border-top: 1px solid #2a2a4e; margin: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛡️ AgentShroud™</h1>
    <div class="tagline">Your agent can do anything — except get away with it.</div>
  </div>
  <div class="meta-bar">
    <span class="report-type">{{REPORT_TYPE}}</span>
    <span>{{REPORT_DATE}}</span>
  </div>
  <div class="content">
    {{REPORT_CONTENT}}
  </div>
  <div class="footer">
    <div>Generated by AgentShroud™ Autonomous Intelligence</div>
    <div><a href="https://agentshroud.ai">agentshroud.ai</a> · <a href="https://github.com/idallasjlabs/agentshroud">GitHub</a></div>
    <div class="tm">AgentShroud™ is a trademark of Isaiah Dallas Jefferson, Jr. © 2026</div>
  </div>
</div>
</body>
</html>
