# AgentShroud Docker Compose — Production (marvin / ijefferson.admin)
# Gateway: security proxy, DNS forwarder, API gateway, all security tools
# Bot: OpenClaw agent, minimal footprint
#
# Usage: docker compose -f docker/docker-compose.yml -p agentshroud up -d
#
# Copyright © 2026 Isaiah Dallas Jefferson, Jr. AgentShroud™. All rights reserved.

name: agentshroud

services:
  # ── Gateway ──────────────────────────────────────────────────────────────────
  # Security proxy, HTTP CONNECT proxy, DNS forwarder, API gateway.
  # SOLE egress point for all container traffic. All outbound logged.
  # Set AGENTSHROUD_VERSION=1.0.0 to build/run versioned images. Defaults to :latest.
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
      args:
        AGENTSHROUD_VERSION: ${AGENTSHROUD_VERSION:-latest}
    # Infra env — load docker/.env regardless of compose invocation directory.
    # Path is relative to this file (docker/), so this always resolves correctly.
    # This prevents the recurring regression where AGENTSHROUD_ALLOWED_IPS and
    # AGENTSHROUD_ALLOWED_PORTS resolve to empty when compose is run from the
    # repo root (which loads the root .env, a GitHub-bot-credentials file).
    env_file:
      - .env
    # Host entries for personal lab — override via AGENTSHROUD_EXTRA_HOSTS env var or docker-compose.override.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "marvin:192.168.7.137"
      - "trillian:192.168.7.103"
      - "raspberrypi:192.168.7.25"
      - "api.telegram.org:149.154.166.110"
    image: agentshroud-gateway:${AGENTSHROUD_VERSION:-latest}
    container_name: agentshroud-gateway
    hostname: gateway
    restart: unless-stopped
    stop_grace_period: "15s"
    ports:
      - 127.0.0.1:8080:8080    # Gateway API; tailscale serve → https://marvin.tail240ea8.ts.net:8080
      - 127.0.0.1:18789:18789  # OpenClaw canvas auth-proxy (CVE-2026-34871); tailscale serve → :18789
                               #   Security: auth-gated (gateway password). No pipeline scan —
                               #   owner-facing UI, human→dashboard traffic, not agent output.
      - 127.0.0.1:9119:9119    # Hermes dashboard TCP forwarder → agentshroud-hermes:9119; tailscale serve → :9119
                               #   Security: no auth, no pipeline scan — tailnet-only (Tailscale ACL
                               #   is the access control). Re-evaluate if exposed beyond tailnet.
      - "127.0.0.1:8642:8642"  # Hermes OpenAI-compatible API TCP forwarder → agentshroud-hermes:8642
    volumes:
      - ../agentshroud.yaml:/app/agentshroud.yaml:ro
      - agentshroud-ssh:/var/agentshroud-ssh:ro
      - gateway-data:/app/data
      - ../web:/app/web:ro
      - ../gateway:/app/gateway:ro
      - ../.benchmarks:/app/.benchmarks:ro
      - agentshroud-workspace:/data/bot-workspace:ro
      - agentshroud-config:/data/bot-config:ro
      # Hermes cron store ONLY (subpath-scoped), read-only — CronStateMonitor
      # (SCRUM-61) watches job lastStatus for failure alerting.  The full
      # hermes-config volume also holds auth.json/mcp.json credentials and
      # must NOT be visible to the gateway (review finding).  OpenClaw's
      # store is already visible via /data/bot-config/cron/jobs.json above.
      - type: volume
        source: hermes-config
        target: /data/hermes-config/cron
        read_only: true
        volume:
          subpath: cron
      - security-reports:/var/log/security
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - wazuh-alerts:/var/ossec/logs/alerts
      - clamav-db:/var/lib/clamav
    secrets:
      - gateway_password
      - telegram_bot_token
      - hermes_telegram_bot_token
      - slack_bot_token
      - slack_signing_secret
      - slack_app_token
      - anthropic_oauth_token
      - openai_api_key
      - google_api_key
      - 1password_bot_email
      - 1password_bot_master_password
      - 1password_bot_secret_key
      - hermes_api_key
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - AGENTSHROUD_EGRESS_APPROVAL_ALL=false
      # AGENTSHROUD_ALLOWED_IPS and AGENTSHROUD_ALLOWED_PORTS are supplied by
      # env_file: .env above.  They must NOT appear here — compose environment:
      # entries override env_file and would shadow the populated values with
      # the empty default, repeating the recurring allowed-IPs regression.
      - GATEWAY_AUTH_TOKEN_FILE=/run/secrets/gateway_password
      - CANVAS_SKIP_BASIC_AUTH=true
      - OP_SERVICE_ACCOUNT_TOKEN_FILE=/run/secrets/1password_service_account
      - PROXY_ALLOWED_NETWORKS=10.254.110.0/24,10.254.111.0/24,10.254.112.0/24
      - AGENTSHROUD_SLACK_OWNER_USER_ID=${AGENTSHROUD_SLACK_OWNER_USER_ID:-}
      - AGENTSHROUD_CONTROL_UI_ORIGINS=${AGENTSHROUD_CONTROL_UI_ORIGINS:-http://localhost:18789,https://localhost:18789,http://127.0.0.1:18789,https://127.0.0.1:18789,https://marvin.tail240ea8.ts.net:18789,http://marvin.tail240ea8.ts.net:18789}
      - AGENTSHROUD_COLLAB_LOCAL_INFO_ONLY=0
      - AGENTSHROUD_TEAMS_JSON=${AGENTSHROUD_TEAMS_JSON:-}
      - AGENTSHROUD_OWNER_DISPLAY_NAME=${AGENTSHROUD_OWNER_DISPLAY_NAME:-Isaiah}
      # Progressive-trust tool-ACL enforcement (SCRUM-78): 'enforce' (default,
      # blocks a too-low-trust tool call) or 'monitor' (log the would-be denial
      # only — staged rollout / instant rollback valve).
      - AGENTSHROUD_PROGRESSIVE_ENFORCEMENT=${AGENTSHROUD_PROGRESSIVE_ENFORCEMENT:-enforce}
      - AGENTSHROUD_MODEL_MODE=${AGENTSHROUD_MODEL_MODE:-cloud}
      - AGENTSHROUD_CLOUD_MODEL_REF=${AGENTSHROUD_CLOUD_MODEL_REF:-anthropic/claude-opus-4-6}
      - AGENTSHROUD_LOCAL_MODEL_REF=${AGENTSHROUD_LOCAL_MODEL_REF:-ollama/qwen3:14b}
      - AGENTSHROUD_LOCAL_MODEL=${AGENTSHROUD_LOCAL_MODEL:-qwen3:14b}
      - AGENTSHROUD_LOCAL_SECONDARY_MODEL_REF=${AGENTSHROUD_LOCAL_SECONDARY_MODEL_REF:-}
      - AGENTSHROUD_LOCAL_FAILOVER_ON_OOM=${AGENTSHROUD_LOCAL_FAILOVER_ON_OOM:-1}
      - AGENTSHROUD_FAILOVER_ON_QUOTA=${AGENTSHROUD_FAILOVER_ON_QUOTA:-1}
      - OPENCLAW_MAIN_MODEL=${OPENCLAW_MAIN_MODEL:-}
      - OPENCLAW_OLLAMA_API=${OPENCLAW_OLLAMA_API:-ollama}
      - LMSTUDIO_API_BASE=${LMSTUDIO_API_BASE:-}
      - MLXLM_API_BASE=${MLXLM_API_BASE:-http://host.docker.internal:8234}
      - AGENTSHROUD_ANCHOR_MODEL=${AGENTSHROUD_ANCHOR_MODEL:-qwen3.6-27b}
      - AGENTSHROUD_CODING_MODEL=${AGENTSHROUD_CODING_MODEL:-qwen2.5-coder:32b}
      - AGENTSHROUD_REASONING_MODEL=${AGENTSHROUD_REASONING_MODEL:-deepseek-r1}
      - DOCKER_CONTENT_TRUST=1
      # Image digest refs for cosign supply-chain verification. Set to
      # repo@sha256:<digest> at deploy time. Left empty disables verification.
      - AGENTSHROUD_BOT_IMAGE_REF=${AGENTSHROUD_BOT_IMAGE_REF:-}
      - AGENTSHROUD_GATEWAY_IMAGE_REF=${AGENTSHROUD_GATEWAY_IMAGE_REF:-}
      - AGENTSHROUD_HERMES_IMAGE_REF=${AGENTSHROUD_HERMES_IMAGE_REF:-}
      - AGENTSHROUD_TRIVY_IMAGES=agentshroud/hermes:latest
      - AGENTSHROUD_COMPOSE_HOST=marvin
      - AGENTSHROUD_COMPOSE_DIR=/Users/agentshroud-bot/Development/agentshroud
      - AGENTSHROUD_INSTANCE_LABEL=${AGENTSHROUD_INSTANCE_LABEL:-prod}
      - TRIVY_CACHE_DIR=/var/log/security/.trivy-cache
      # Group chat: bot @handles (without @) for at-mention-only filtering in groups.
      # The singleton gateway proxy uses TELEGRAM_BOT_USERNAME for the default (openclaw)
      # bot and HERMES_TELEGRAM_BOT_USERNAME for hermes, keyed by bot_id (SCRUM-45).
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-agentshroud_bot}
      - HERMES_TELEGRAM_BOT_USERNAME=${HERMES_TELEGRAM_BOT_USERNAME:-agentshroud_hermes_bot}
      # Group chat: comma-separated Telegram group/supergroup chat IDs to allow.
      # Each ID binds to a per-chat group-{chatId} agent (approval-router compatible).
      # Legacy single-ID var kept for compat: AGENTSHROUD_GROUP_CHAT_ID.
      - AGENTSHROUD_GROUP_CHAT_IDS=${AGENTSHROUD_GROUP_CHAT_IDS:-}
      - AGENTSHROUD_GROUP_CHAT_ID=${AGENTSHROUD_GROUP_CHAT_ID:-}
      # Voice terminal: fast model for gateway-routed chat/completions (Haiku = 3-8 s vs Opus 30-60 s)
      - GATEWAY_CHAT_MODEL=${GATEWAY_CHAT_MODEL:-claude-haiku-4-5-20251001}
      # Router timezone for date/time injection in OpenAI-compat system messages
      - GATEWAY_TZ=${GATEWAY_TZ:-America/New_York}
    group_add:
      - "991"   # docker socket GID — read-only service introspection for SOC
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp/gateway-seccomp.json
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - PERFMON
    pid: host
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /var/tmp:noexec,nosuid,size=50m
      - /var/log/fluent-bit:noexec,nosuid,size=50m
      - /var/log/falco:noexec,nosuid,size=50m
      - /var/ossec/var:nosuid,size=10m,uid=1000,gid=1000
      - /var/ossec/queue:nosuid,size=50m,uid=1000,gid=1000
      - /var/ossec/tmp:noexec,nosuid,size=10m,uid=1000,gid=1000
      - /var/ossec/logs/ossec:noexec,nosuid,size=20m,uid=1000,gid=1000
    mem_limit: 4096m
    memswap_limit: 4096m
    cpus: 1.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --max-time
        - "8"
        - http://127.0.0.1:8080/status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Gateway DNS — defaults to public resolvers. Override via AGENTSHROUD_DNS_PRIMARY/SECONDARY
    # in docker/.env for site-specific resolvers (e.g. Pi-hole, local router).
    dns:
      - ${AGENTSHROUD_DNS_PRIMARY:-1.1.1.1}
      - ${AGENTSHROUD_DNS_SECONDARY:-8.8.8.8}
      - 192.168.64.1
      - 1.1.1.1
      - 8.8.8.8

    # Gateway on BOTH networks: internal (internet) + isolated (to bot)
    networks:
      - agentshroud-internal
      - agentshroud-isolated

  # ── Bot ──────────────────────────────────────────────────────────────────────
  # OpenClaw agent. Fully isolated — no direct internet, no host access.
  # All egress through gateway proxy. DNS: Docker internal only.
  openclaw:
    build:
      context: ..
      dockerfile: docker/bots/openclaw/Dockerfile
      args:
        AGENTSHROUD_VERSION: ${AGENTSHROUD_VERSION:-latest}
    # Host entries for personal lab — override via AGENTSHROUD_EXTRA_HOSTS env var or docker-compose.override.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "marvin:192.168.7.137"
      - "trillian:192.168.7.103"
      - "raspberrypi:192.168.7.25"
      - "api.telegram.org:149.154.166.110"
    image: agentshroud-openclaw:${AGENTSHROUD_VERSION:-latest}
    container_name: agentshroud-openclaw
    hostname: agentshroud-openclaw
    restart: unless-stopped
    stop_grace_period: "15s"
    # Port 18789 is no longer published directly — Canvas traffic is now
    # routed through the gateway's auth-proxy (CVE-2026-34871 mitigation).
    volumes:
      - agentshroud-config:/home/node/.openclaw
      - agentshroud-collab-workspaces:/home/node/.agentshroud
      - agentshroud-workspace:/home/node/agentshroud/workspace
      - gateway-data:/home/node/agentshroud/gateway-data:ro
      - agentshroud-ssh:/home/node/.ssh
      - openclaw-runtime:/home/node/.npm-global
      - agentshroud-browsers:/home/node/.cache/ms-playwright
      - ../branding:/app/branding:ro
      - memory-backups:/app/memory-backups
      - wazuh-alerts:/var/ossec/logs/alerts
    secrets:
      - gateway_password
      - telegram_bot_token
      - slack_bot_token
      - slack_app_token
      - anthropic_oauth_token
      - openai_api_key
      - google_api_key
      - 1password_bot_email
      - 1password_bot_master_password
      - 1password_bot_secret_key
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-lan}
      - OP_SERVICE_ACCOUNT_TOKEN_FILE=/run/secrets/1password_service_account
      - OPENCLAW_GATEWAY_PASSWORD_FILE=/run/secrets/gateway_password
      - TELEGRAM_BOT_TOKEN_FILE=/run/secrets/telegram_bot_token
      - HTTP_PROXY=http://gateway:8181
      - HTTPS_PROXY=http://gateway:8181
      - NO_PROXY=gateway,localhost,127.0.0.1
      - NODE_OPTIONS=--require /app/config-defaults/openclaw/setup-https-proxy.js
      - GATEWAY_OP_PROXY_URL=http://gateway:8080
      - ANTHROPIC_BASE_URL=http://gateway:8080
      - OPENAI_BASE_URL=http://gateway:8080
      - GEMINI_BASE_URL=http://gateway:8080
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://gateway:8080/v1}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - AGENTSHROUD_MODEL_MODE=${AGENTSHROUD_MODEL_MODE:-cloud}
      - AGENTSHROUD_LOCAL_MODEL_REF=${AGENTSHROUD_LOCAL_MODEL_REF:-ollama/qwen3:14b}
      - AGENTSHROUD_CLOUD_MODEL_REF=${AGENTSHROUD_CLOUD_MODEL_REF:-anthropic/claude-opus-4-6}
      - OPENCLAW_MAIN_MODEL=${OPENCLAW_MAIN_MODEL:-}
      - OPENCLAW_OLLAMA_API=${OPENCLAW_OLLAMA_API:-ollama}
      - AGENTSHROUD_LOCAL_MODEL=${AGENTSHROUD_LOCAL_MODEL:-qwen3:14b}
      - LMSTUDIO_API_BASE=${LMSTUDIO_API_BASE:-}
      - AGENTSHROUD_ANCHOR_MODEL=${AGENTSHROUD_ANCHOR_MODEL:-qwen3.6-27b}
      - AGENTSHROUD_CODING_MODEL=${AGENTSHROUD_CODING_MODEL:-qwen2.5-coder:32b}
      - AGENTSHROUD_REASONING_MODEL=${AGENTSHROUD_REASONING_MODEL:-deepseek-r1}
      - AGENTSHROUD_TEAMS_JSON=${AGENTSHROUD_TEAMS_JSON:-}
      - AGENTSHROUD_COLLAB_LOCAL_INFO_ONLY=${AGENTSHROUD_COLLAB_LOCAL_INFO_ONLY:-0}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - TELEGRAM_API_BASE_URL=http://gateway:8080/telegram-api
      - SLACK_API_BASE_URL=http://gateway:8080/slack-api
      - AGENTSHROUD_SLACK_OWNER_USER_ID=${AGENTSHROUD_SLACK_OWNER_USER_ID:-}
      - AGENTSHROUD_CONTROL_UI_ORIGINS=${AGENTSHROUD_CONTROL_UI_ORIGINS:-http://localhost:18789,https://localhost:18789,http://127.0.0.1:18789,https://127.0.0.1:18789,https://marvin.tail240ea8.ts.net:18789,http://marvin.tail240ea8.ts.net:18789}
      - GATEWAY_HOST_PORT=8080
      - AGENTSHROUD_GROUP_CHAT_IDS=${AGENTSHROUD_GROUP_CHAT_IDS:-}
      - AGENTSHROUD_GROUP_CHAT_ID=${AGENTSHROUD_GROUP_CHAT_ID:-}
      - OPENCLAW_BOT_NAME=agentshroud_bot
      - OPENCLAW_BOT_EMAIL=${OPENCLAW_BOT_EMAIL:-bot@example.com}
      - OPENCLAW_DISABLE_HOST_FILESYSTEM=true
      - OPENCLAW_SANDBOX_MODE=strict
      - OPENCLAW_DISABLE_BONJOUR=1
      - AGENTSHROUD_INSTANCE_LABEL=${AGENTSHROUD_INSTANCE_LABEL:-prod}
      - NPM_CONFIG_PREFIX=/home/node/.npm-global
      - NPM_CONFIG_CACHE=/home/node/.npm-global/.cache
      - PATH=/home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp/agentshroud-seccomp.json
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=500m
      - /var/tmp:noexec,nosuid,size=100m
      - /home/node/.npm:noexec,nosuid,size=200m,uid=1000,gid=1000
      - /home/node/.local:noexec,nosuid,size=100m
      - /home/node/.config:noexec,nosuid,size=100m,uid=1000,gid=1000
      - /home/node/.agentshroud/agents:nosuid,size=200m,uid=1000,gid=1000  # tmpfs overlay; parent vol provides collab/ persistence
      - /home/node/.ssh-tmp:nosuid,size=10m,uid=1000,gid=1000
      - /var/ossec/var:nosuid,size=10m,uid=1000,gid=1000
      - /var/ossec/queue:nosuid,size=50m,uid=1000,gid=1000
      - /var/ossec/tmp:noexec,nosuid,size=10m,uid=1000,gid=1000
      - /var/ossec/logs/ossec:noexec,nosuid,size=20m,uid=1000,gid=1000
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:18789/ -o /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Bot DNS — defaults to public resolvers. Override via AGENTSHROUD_DNS_PRIMARY/SECONDARY
    # in docker/.env for site-specific resolvers (e.g. Pi-hole, local router).
    dns:
      - ${AGENTSHROUD_DNS_PRIMARY:-1.1.1.1}
      - ${AGENTSHROUD_DNS_SECONDARY:-8.8.8.8}
      - 192.168.64.1
      - 1.1.1.1
      - 8.8.8.8
    # Bot is now on agentshroud-isolated only. Canvas port 18789 is no longer
    # published directly from the bot — traffic routes through the gateway's
    # auth-proxy on 127.0.0.1:18789 (CVE-2026-34871 mitigation).
    # The gateway can reach agentshroud-openclaw:18789 via agentshroud-isolated.
    networks:
      - agentshroud-isolated
    depends_on:
      gateway:
        condition: service_healthy

  # ── Hermes Agent (second bot — v1.1.0 bot-agnostic proof) ────────────────────
  # AgentShroud™ Patent Pending — U.S. Provisional Application No. 64/018,744
  # Hermes runs alongside OpenClaw on the same isolated network. All egress
  # flows through gateway:8181 (HTTP_PROXY) so the same 76-module security
  # pipeline applies regardless of bot runtime.
  hermes:
    # Profiles: start Hermes only when explicitly requested.
    # `docker-compose --profile hermes up -d`  — Hermes only
    # `docker-compose --profile full up -d`    — gateway + openclaw + hermes
    # `docker-compose up -d`                   — gateway + openclaw only (default)
    profiles: [hermes, full]
    image: agentshroud/hermes:${AGENTSHROUD_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/bots/hermes/Dockerfile
    container_name: agentshroud-hermes
    hostname: agentshroud-hermes
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - agentshroud-isolated      # no direct internet — all egress via gateway:8181
    volumes:
      - hermes-config:/opt/data
      - gateway-data:/data/gateway:ro
    secrets:
      - hermes_telegram_bot_token
      - slack_bot_token_hermes
      - slack_app_token_hermes
      - brave_api_key
      - anthropic_oauth_token
      - openai_api_key
      - hermes_api_key
      - github_pat
      - hermes_healthchecks_url
      - gateway_password
    environment:
      HTTP_PROXY: http://gateway:8181
      HTTPS_PROXY: http://gateway:8181
      # api.telegram.org in NO_PROXY makes resolve_proxy_url() return None for
      # Telegram targets, so PTB gets no explicit proxy and httpx honours the
      # env NO_PROXY=gateway rule — sending getMe/getUpdates directly to
      # gateway:8080 (our Telegram proxy) instead of through EgressFilter:8181.
      # Hermes never connects to api.telegram.org directly; EgressFilter still
      # blocks any accidental direct Telegram egress at the network level.
      NO_PROXY: gateway,agentshroud-hermes,api.telegram.org,127.0.0.1,localhost
      ANTHROPIC_BASE_URL: http://gateway:8080
      OLLAMA_BASE_URL: http://gateway:8080/v1
      # Local-model parity (Workstream C): Hermes can run fully on local LLMs.
      # These mirror the gateway env vars so both bots switch atomically via switch_model.sh.
      AGENTSHROUD_MODEL_MODE: ${AGENTSHROUD_MODEL_MODE:-cloud}
      AGENTSHROUD_LOCAL_MODEL_REF: ${AGENTSHROUD_LOCAL_MODEL_REF:-ollama/qwen3:14b}
      AGENTSHROUD_LOCAL_MODEL: ${AGENTSHROUD_LOCAL_MODEL:-qwen3:14b}
      HERMES_MAIN_MODEL: ${HERMES_MAIN_MODEL:-}
      # Owner-only allow-list for v1.1.0 launch. Add collaborators after smoke tests pass.
      TELEGRAM_ALLOWED_USERS: "8096968754"
      TELEGRAM_HOME_CHANNEL: "8096968754"
      # Disable fallback-IP transport: TelegramFallbackTransport bypasses our gateway
      # by connecting directly to api.telegram.org's resolved IPs, causing 405 on our
      # /telegram-api/bot{token}/{method} paths. With this disabled, PTB uses a plain
      # HTTPXRequest that honours base_url → http://gateway:8080/telegram-api/bot.
      HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "1"
      HERMES_DASHBOARD: "1"
      # v0.17.0: HERMES_DASHBOARD_INSECURE removed. Loopback bind skips auth gate.
      # Host publish (127.0.0.1:9119:9119) is still reachable via `docker exec` or
      # SSH/Tailscale tunnel from marvin. Configure basic auth when an OAuth app is
      # provisioned: set HERMES_DASHBOARD_BASIC_AUTH_USERNAME + _PASSWORD.
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
      AGENTSHROUD_BOT_ID: hermes
      API_SERVER_ENABLED: "1"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # API_SERVER_KEY is intentionally NOT set here. It is injected by
      # docker/bots/hermes/agentshroud-secrets.sh via s6 with-contenv from
      # /run/secrets/hermes_api_key. Setting it in environment: would shadow
      # the cont-init value with an empty string when the host var is unset,
      # causing Hermes to reject every gateway request (start.sh:78-82).
    # Security note: nousresearch/hermes-agent uses s6-overlay which must start as root
    # and drop to UID 10000 via s6-setuidgid. cap_drop: ALL and no-new-privileges break
    # this. Primary security boundaries: agentshroud-isolated network + seccomp + resource limits.
    security_opt:
      - seccomp=./seccomp/agentshroud-seccomp.json
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      # v0.15.1: dashboard auth gate blocks 9119 binding without a DashboardAuthProvider.
      # Probe the OpenAI-compatible API /health endpoint on 8642 instead.
      # start_period=120s covers s6 init + skill sync + gateway startup.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ── Voice Gateway (ESP32-S3-BOX-3 STT/TTS bridge) ────────────────────────────
  # AgentShroud™ Patent Pending — U.S. Provisional Application No. 64/018,744
  # Receives 16-bit PCM from the BOX-3 over WebSocket (:8765/voice),
  # transcribes with faster-whisper, forwards text through the governed /forward
  # path to Hermes, synthesizes the reply with Piper TTS, and streams PCM back.
  voice-gateway:
    profiles: [voice, full]
    build:
      context: ..
      dockerfile: voice_gateway/Dockerfile
      args:
        WHISPER_MODEL_SIZE: small.en
    container_name: agentshroud-voice-gateway
    hostname: agentshroud-voice-gateway
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - agentshroud-internal    # required for Docker host port publishing (internal: true nets cannot NAT)
      - agentshroud-isolated    # egress isolation — all outbound via gateway:8181 HTTP proxy
    ports:
      - "8765:8765"  # Phase 1 LAN; Phase 2 restrict to loopback + tailscale serve
    environment:
      HTTP_PROXY: http://gateway:8181
      HTTPS_PROXY: http://gateway:8181
      NO_PROXY: gateway,agentshroud-voice-gateway,127.0.0.1,localhost
      GATEWAY_URL: http://gateway:8080
      GATEWAY_AUTH_TOKEN_FILE: /run/secrets/gateway_password
      # RBAC: voice-terminal is operated by the owner — use owner Telegram UID so
      # middleware maps the request to OWNER role (tool_use permission required for /forward).
      GATEWAY_OWNER_USER_ID: "8096968754"
      VG_HOST: "0.0.0.0"
      VG_PORT: "8765"
      # WS auth: token the ESP32 must send as ?token= in the connection URL.
      VOICE_GW_AUTH_TOKEN_FILE: /run/secrets/voice_gateway_token
      # Default agent for voice → proxied-agent routing.  Override per-connection via ?agent=.
      # "hermes" = Hermes agentic assistant (synchronous OpenAI-compat reply via /forward).
      # "direct" = legacy fast-path LLM proxy (no agentic tools, lower latency).
      VOICE_DEFAULT_AGENT: "hermes"
      FIRMWARE_BIN_PATH: /firmware/build/voice_terminal.bin
      # TTS naturalness: 0.92× pacing reads noticeably less robotic on the
      # BOX-3 speaker than the 1.0 default (owner feedback 2026-07-03).
      KOKORO_SPEED: "0.92"
      # af_bella: more expressive/natural than the af_heart default
      # (owner: "voice doesn't sound natural", 2026-07-03).
      KOKORO_VOICE: "af_bella"
    secrets:
      - gateway_password
      - voice_gateway_token
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../firmware/voice-terminal/build:/firmware/build:ro
    # 4g: torch+faster-whisper+Kokoro LOAD peak transiently exceeds 3g under VM
    # memory pressure → kernel OOM-kills PID 1 (die 137) → restart loop.  Caught
    # live 2026-07-02 (docker events: oom → die 137, repeating).  Steady-state
    # is ~0.3–1.7g; only the startup peak needs the headroom.
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8765/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3


# ── Secrets ────────────────────────────────────────────────────────────────────
# `asb up/rebuild/clean-rebuild` extracts secrets from the credential backend
# (1Password/Keychain/secret-tool) into a tmpdir and overrides these file: paths
# at runtime — no persistent plaintext files on the host. The paths below are
# fallbacks for manual `docker compose` usage; run `./setup-secrets.sh extract`
# to populate them, or prefer `asb up` (recommended).
secrets:
  gateway_password:
    file: ./secrets/gateway_password.txt
  voice_gateway_token:
    file: ./secrets/voice_gateway_token.txt
  anthropic_oauth_token:
    file: ./secrets/anthropic_oauth_token.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  google_api_key:
    file: ./secrets/google_api_key.txt
  1password_bot_email:
    file: ./secrets/1password_bot_email.txt
  1password_bot_master_password:
    file: ./secrets/1password_bot_master_password.txt
  1password_bot_secret_key:
    file: ./secrets/1password_bot_secret_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token_production.txt
  slack_bot_token:
    file: ./secrets/slack_bot_token.txt
  slack_signing_secret:
    file: ./secrets/slack_signing_secret.txt
  slack_app_token:
    file: ./secrets/slack_app_token.txt
  hermes_telegram_bot_token:
    file: ./secrets/hermes_telegram_bot_token.txt
  slack_bot_token_hermes:
    file: ./secrets/slack_bot_token_hermes.txt
  slack_app_token_hermes:
    file: ./secrets/slack_app_token_hermes.txt
  brave_api_key:
    file: ./secrets/brave_api_key.txt
  hermes_api_key:
    file: ./secrets/hermes_api_key.txt
  github_pat:
    file: ./secrets/github_pat.txt
  hermes_healthchecks_url:
    file: ./secrets/hermes_healthchecks_url.txt

# ── Networks ───────────────────────────────────────────────────────────────────
# Two networks: internal (internet access) and isolated (no internet)
# Gateway is on agentshroud-internal + agentshroud-isolated.
# Bot is on agentshroud-isolated (agent traffic) + agentshroud-console (Control UI port publish).
networks:
  agentshroud-internal:
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 10.254.110.0/24
  agentshroud-isolated:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.254.111.0/24
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
  agentshroud-console:
    # Retained for backwards compatibility with override files.
    # Canvas port 18789 is now published by the gateway (via canvas auth-proxy),
    # not the bot directly. The bot no longer joins this network.
    driver: bridge
    internal: false
    ipam:
      config:
        - subnet: 10.254.112.0/24

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  gateway-data:
    driver: local
  agentshroud-config:
    driver: local
  agentshroud-workspace:
    driver: local
  agentshroud-ssh:
    driver: local
  agentshroud-browsers:
    driver: local
  openclaw-runtime:
    name: openclaw-runtime
  security-reports:
    driver: local
  wazuh-alerts:
    driver: local
  clamav-db:
    driver: local
  memory-backups:
    driver: local
  agentshroud-collab-workspaces:
    driver: local
  hermes-config:
    driver: local
    name: hermes-config
