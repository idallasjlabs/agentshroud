# Pre-commit hooks for secret detection and security
# Install: nix develop   (provides pre-commit, semgrep and gitleaks via
#          flake.nix devTools), then: pre-commit install
# Run manually: pre-commit run --all-files
#
# This file is the SINGLE owner of .git/hooks/pre-commit as of 2026-09-20.
# Three systems used to compete for that one path and the weakest won: a bare
# `git secrets --install` had overwritten it with a two-line git-secrets call,
# so gitleaks, detect-secrets, ruff, black and semgrep ran on no commit at all.
# .llm_settings/git-hooks/install.sh also copies its own script over the same
# path — do not run it against this repo, or it will displace these hooks
# again. The git-secrets check it provided is carried below so nothing is lost.

repos:
  # Gitleaks - Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # Pre-commit built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10000']  # 10MB limit
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # Vendored upstream compliance content must stay byte-identical to what
      # ComplianceAsCode publishes, so it can be verified against their released
      # SHA512. On 2026-09-24 these hooks rewrote 1080 lines of
      # ssg-debian13-ds.xml on the way in; the XML stayed valid, but the file no
      # longer matched upstream and its provenance became unverifiable. For a
      # security product that is the whole point of shipping the datastream.
      - id: trailing-whitespace
        exclude: ^docker/scap-content/ssg-debian[0-9]+-ds\.xml$
      - id: end-of-file-fixer
        exclude: ^docker/scap-content/ssg-debian[0-9]+-ds\.xml$

  # Detect-secrets - Advanced secret detection
  # v1.4.0 until 2026-09-20, which could not read .secrets.baseline (generated
  # by 1.5.0) — it aborted with "baseline made by a newer detect-secrets
  # version" + TypeError, blocking every commit. Invisible while no hook was
  # installed; surfaced the moment pre-commit took ownership of the hook path.
  # Keep this rev in step with .secrets.baseline's "version" field.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^gateway/
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^gateway/

  # Semgrep - SAST for Python gateway source (IEC 62443 4-1 SDL)
  # Catches: command injection, path traversal, hardcoded secrets, SSRF
  #
  # `repo: local` + `language: system` rather than the upstream pre-commit
  # repo, for two measured reasons (both 2026-09-20):
  #   1. --baseline-commit HEAD reports only findings the staged change
  #      INTRODUCES. gateway/ carries 136 pre-existing findings, so a plain
  #      `--error` run exits 1 on almost any gateway file you touch (verified
  #      on gateway/web/installer.py). A hook that blocks routine commits
  #      trains everyone to `git commit --no-verify`, which disables the
  #      secret scanners above too — strictly worse than no hook. This matches
  #      the --baseline-commit gate in .github/workflows/security-scan.yml, so
  #      local and CI cannot disagree.
  #   2. The upstream repo makes pre-commit pip-install semgrep into an
  #      isolated env; that download fails on the dev host (large TLS streams
  #      abort with "record layer failure" past ~27MB). `language: system`
  #      uses the semgrep provided by flake.nix devTools instead — which is
  #      also what CLAUDE.md section 5 asks for (Nix, not pip/brew).
  # Version is pinned by flake.nix locally and by an explicit pin in CI.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (agentshroud rules, new findings only)
        entry: semgrep scan --config .semgrep.yml --error --quiet --baseline-commit HEAD
        language: system
        types: [python]
        files: ^gateway/

  # Carried over from .llm_settings/git-hooks/pre-commit so that pre-commit
  # owning the hook path loses none of that script's coverage. `language:
  # system` because git-secrets is provisioned by the toolchain, not by pip.
  - repo: local
    hooks:
      - id: git-secrets
        name: git-secrets (AWS credential patterns)
        entry: git-secrets --pre_commit_hook --
        language: system
        pass_filenames: true
