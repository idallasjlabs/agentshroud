# Codex CLI MCP Server Configuration
# Generated from .llm_settings/.mcp.json
# NOTE: single-table [mcp_servers.X] form — codex >= 0.154 rejects the
# array-of-tables [[mcp_servers.X]] form ("invalid type: map, expected a string").

[mcp_servers.github]
command = ".llm_settings/mcp-servers/github/default/github-mcp-wrapper.sh"
args = []

[mcp_servers.github-idallasj]
command = ".llm_settings/mcp-servers/github/idallasj/github-mcp-wrapper.sh"
args = []
timeout = 60000
trust = false

[mcp_servers.github-agentshroud]
command = ".llm_settings/mcp-servers/github/agentshroud/github-mcp-wrapper.sh"
args = []
timeout = 60000
trust = false

[mcp_servers.atlassian-agentshroud]
command = ".llm_settings/mcp-servers/atlassian/agentshroud/mcp-atlassian.sh"
args = []
timeout = 1800000
trust = false

[mcp_servers.atlassian-idallasj]
command = ".llm_settings/mcp-servers/atlassian/idallasj/mcp-atlassian.sh"
args = []
timeout = 1800000
trust = false

[mcp_servers.xmind]
command = "/opt/homebrew/bin/npx"
args = ["-y", "xmind-generator-mcp"]
timeout = 60000
trust = false

[mcp_servers.xmind.env]
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
outputPath = "${HOME}/Desktop"
autoOpenFile = "true"

[mcp_servers.safari]
command = "/opt/homebrew/bin/npx"
args = ["-y", "safari-mcp"]
timeout = 60000
trust = false

[mcp_servers.safari.env]
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

[mcp_servers.home-assistant]
command = ".llm_settings/mcp-servers/home-assistant/mcp-ha.sh"
args = []
timeout = 300000
trust = false

[mcp_servers.devonthink]
command = ".llm_settings/mcp-servers/devonthink/mcp-devonthink.sh"
args = []
timeout = 30000
trust = false
