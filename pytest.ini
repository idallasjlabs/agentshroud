[pytest]
cache_dir = /tmp/.pytest_cache
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Safety net for hung tests (pytest-timeout). Discovered 2026-08-14: an
# async concurrency test with no timeout hung for 7+ minutes on
# macos-latest/3.11 CI with zero diagnostic output, until the runner's own
# 20-minute job timeout killed it — see test_ws_stop_during_speaking_aborts_tts
# in gateway/tests/test_voice_gateway.py for the specific suspected race (two
# tasks concurrently awaiting the same mocked ws.receive() side_effect queue).
# 60s is generous for this suite (CLAUDE.md requires tests be fast/mocked, no
# real sleeps/network) but turns any future hang into a fast, stack-trace-
# bearing failure instead of a 20-minute mystery timeout. thread-based timeout
# is used (not the signal-based default) since it interrupts asyncio event
# loops more reliably than SIGALRM delivery into a blocked asyncio.wait().
timeout = 60
timeout_method = thread
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning:fastapi
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore::DeprecationWarning:websockets.legacy
    ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl
    ignore::DeprecationWarning:websockets.exceptions
    ignore:unclosed database:ResourceWarning
    ignore:unclosed database:pytest.PytestUnraisableExceptionWarning
