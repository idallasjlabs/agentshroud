<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentShroud</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px;
        width: 260px;
        background: #0f1420;
        color: #e6e9ef;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
        letter-spacing: 0.02em;
      }
      button {
        display: block;
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border: 0;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        background: #2b6cff;
        color: #fff;
      }
      button.secondary {
        background: #263042;
      }
      #status {
        font-size: 11px;
        min-height: 14px;
        margin-top: 8px;
        color: #9aa4b2;
      }
      a {
        color: #6ea8ff;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>AgentShroud</h1>
    <button id="forwardUrl">Forward this URL</button>
    <button id="clipPage" class="secondary">Clip this page</button>
    <div id="status"></div>
    <a href="#" id="openOptions">Configure gateway…</a>
    <script src="popup.js"></script>
  </body>
