# Inbound MCP Edge vendor profile — see docs/inbound-mcp-edge/vendors.md.
# Ships DISABLED. Enable only on the owner's instruction (runbook: 04-runbook.md).
vendor: meta-muse
display_name: Meta Muse
connection: mcp
# Meta documents built-in and "Custom Connectors" for the consumer app, but no
# user-facing flow for adding an arbitrary MCP server URL (checked 2026-11-11).
# Third-party reports of a working Custom Connector are not confirmation.
support: unconfirmed
docs:
  - https://www.arcade.dev/blog/connect-meta-muse-mcp-gateway/
  - https://www.aiagentslibrary.com/blog/meta-muse-mcp/
enabled: false
mode: enforce
auth:
  oauth: true
  dynamic_registration: true
  redirect_uris:
    # Empty until Muse is seen registering during a pilot window: OAuth cannot complete.
    []
  static_bearer: false

tools:
  lab_search: read
  pke_status: read
limits:
  per_client_per_minute: 30
  per_vendor_per_minute: 60
  max_concurrency: 4
  daily_calls: 500
  daily_delegations: 0
dlp:
  mode: redact
  min_confidence: 0.9
max_response_bytes: 1048576
