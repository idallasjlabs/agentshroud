# Inbound MCP Edge vendor profile — see docs/inbound-mcp-edge/vendors.md.
# Ships DISABLED. Enable only on the owner's instruction (runbook: 04-runbook.md).
vendor: openai-dots
display_name: OpenAI Dots
connection: chat-bridge
support: unconfirmed
docs:
  - https://learn.chatgpt.com/codex/dots/computers-and-apps
enabled: false
mode: enforce
auth:
  oauth: true
  dynamic_registration: false
  redirect_uris:
    # Custom MCP from Dots is UNCONFIRMED; Dots is bridged via Slack (SCRUM-220).
    []
  static_bearer: false

tools:
  lab_search: read
  pke_status: read
limits:
  per_client_per_minute: 30
  per_vendor_per_minute: 60
  max_concurrency: 4
  daily_calls: 500
  daily_delegations: 20
dlp:
  mode: redact
  min_confidence: 0.9
max_response_bytes: 1048576
