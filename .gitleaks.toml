# AgentShroud™ gitleaks configuration
# Prevents secrets from being committed to the repository.
#
# Full history was rewritten with git-filter-repo in 2026-06 (PR #227 + Phase B)
# to purge all real secret values from every commit.  The history is now clean;
# no SHA pin is required and CI scans the full history.

title = "AgentShroud gitleaks config"

[extend]
# Use the upstream default ruleset as the base
useDefault = true

[allowlist]
description = "Known safe patterns in this repo"

# Paths that contain intentionally fake / example credential strings
paths = [
  '''gateway/tests/''',
  '''gateway/examples/''',
  '''tests/''',
  '''docs/''',
  '''docker/scap-content/''',
  '''.llm_settings/''',
  # Agent skill/config dirs contain example AWS credential configs for documentation
  '''\.claude/''',
  '''\.codex/''',
  '''\.gemini/''',
  # The ignore file itself references known-fake key strings in comments
  '''\.gitleaksignore''',
  # Config files reference fake patterns as allowlist entries — not real credentials
  '''\.gitleaks\.toml''',
  '''\.gitguardian\.yaml''',
  '''\.gitallowed''',
]

# Patterns that appear in test fixtures, example configs, or benchmark XML
# and are not real credentials (clearly fake values).
regexes = [
  # AWS public documentation example key IDs — used as safe test fixtures
  '''AKIAIOSFODNN7EXAMPLE''',
  '''AKIAI44QH8DHBEXAMPLE''',
  # Fake gateway passwords used in tests/examples
  '''YOUR_GATEWAY_PASSWORD_HERE''',
  # Fake API keys used in test fixtures
  '''sk-example-not-a-real-key''',
  # Fake JWT used in test fixtures
  '''EXAMPLE_PAYLOAD\.EXAMPLE_SIGNATURE''',
  # Fake canary value used in output canary tests
  '''EXAMPLE_CANARY_VALUE''',
  # Fake Google OAuth used in examples
  '''GOCSPX-EXAMPLE''',
  # Fake 1Password secret key used in examples
  '''A3-XXXXXX''',
]
