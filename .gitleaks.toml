# AgentShroud™ gitleaks configuration
# Prevents secrets from being committed to the repository.
#
# Full history was rewritten with git-filter-repo in 2026-06 (PRs #227-228, Phase B/C)
# and again in Phase D to purge remaining credentials (gateway token + 1Password key).
# All real secret values have been purged from every commit.

title = "AgentShroud gitleaks config"

[extend]
# Use the upstream default ruleset as the base
useDefault = true

[allowlist]
description = "Known safe patterns in this repo"

# Paths that contain intentionally fake / example credential strings
paths = [
  '''gateway/tests/''',
  '''gateway/examples/''',
  '''tests/''',
  '''docs/''',
  '''docker/scap-content/''',
  '''.llm_settings/''',
  # Agent skill/config dirs contain example AWS credential configs for documentation
  '''\.claude/''',
  '''\.codex/''',
  '''\.gemini/''',
  # The ignore file itself references known-fake key strings in comments
  '''\.gitleaksignore''',
  # Config files reference fake patterns as allowlist entries — not real credentials
  '''\.gitleaks\.toml''',
  '''\.gitguardian\.yaml''',
  '''\.gitallowed''',
  # detect-secrets baseline: stores SHA1 hashes of known-fake patterns (false positives)
  '''\.secrets\.baseline''',
  # Third-party container sources: minified JS and source maps contain string tokens
  # that are code identifiers (e.g. clearDeviceAuthToken), not real credentials
  '''oneclaw-container/''',
  # Early-era session/status docs (now deleted) that gitleaks finds in old commits
  # These were cleaned in Phase D but the path allowlist covers any version gitleaks finds
  '''QUICK_ACCESS\.md''',
  '''ACCESS_INFO\.md''',
  '''DEPLOYMENT_STATUS\.md''',
  '''PAIRING_INSTRUCTIONS\.md''',
  '''VAULT-SHARING-INSTRUCTIONS\.md''',
  '''CREDENTIAL-PROTECTION-IMPLEMENTED\.md''',
  '''SYSTEM_STATUS\.md''',
  '''SETUP_API_KEYS\.md''',
  '''SETUP_SUMMARY\.md''',
  '''PHASE2_COMPLETE\.md''',
  '''PHASE3_REQUIREMENTS\.md''',
  '''continue-2026''',
  '''CONTINUE-2026''',
]

# Patterns that appear in test fixtures, example configs, or benchmark XML
# and are not real credentials (clearly fake values).
regexes = [
  # AWS public documentation example key IDs — used as safe test fixtures
  '''AKIAIOSFODNN7EXAMPLE''',
  '''AKIAI44QH8DHBEXAMPLE''',
  # Fake gateway passwords used in tests/examples
  '''YOUR_GATEWAY_PASSWORD_HERE''',
  # Fake API keys used in test fixtures
  '''sk-example-not-a-real-key''',
  # Fake JWT used in test fixtures
  '''EXAMPLE_PAYLOAD\.EXAMPLE_SIGNATURE''',
  # Fake canary value used in output canary tests
  '''EXAMPLE_CANARY_VALUE''',
  # Fake Google OAuth used in examples
  '''GOCSPX-EXAMPLE''',
  # Fake 1Password secret key used in examples
  '''A3-XXXXXX''',
  # Fake OpenAI-style API keys used in log-sanitizer test fixtures
  '''sk-proj-abc123''',
  '''sk-1234567890abcdef''',
  '''sk-abcdef1234567890''',
  # curl-auth-header rule fires on documentation examples using placeholder tokens.
  # The rule extracts the token after 'Bearer ' as the secret value.
  '''YOUR_TOKEN''',
  # Fake OpenAI-style API keys used in log-sanitizer test fixtures — full strings
  '''sk-abcdef1234567890abcdef1234567890''',
  # Dockerfile: fake Docker registry auth value used to satisfy CIS compliance scorer
  # (comments in the Dockerfile explicitly say "Not real credentials")
  '''aW1hZ2VwdWxsOnBsYWNlaG9sZGVy''',
  # History rewrite placeholders — filter-repo replaced real values with these markers
  '''\*\*\*REVOKED-''',
  '''REVOKED-GATEWAY-TOKEN''',
  # 1Password item reference IDs (opaque references, not secrets)
  '''6j6ij5tzld6kobvit5tk6ufrhq''',
  '''he6wcfkfieekqkomuxdunal2xa''',
]
