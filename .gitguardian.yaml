# AgentShroud™ ggshield / GitGuardian CLI configuration
#
# NOTE: This file controls the ggshield CLI tool and pre-commit hook only.
# The GitGuardian SaaS dashboard ignores it — to silence dashboard reports
# from historical findings, mark each incident "Resolved" in the dashboard.
#
# See: https://docs.gitguardian.com/ggshield-docs/reference/configuration

exit-zero: false     # still fail the hook; allows us to triage interactively

secret:
  # Paths that legitimately contain synthetic/example credential strings used
  # as test fixtures for the production credential-leak detectors.  These are
  # FAKE values that are deliberately credential-shaped so the detector logic
  # can be exercised.  They are NOT real credentials.
  ignored-paths:
    - gateway/tests/
    - gateway/examples/
    - tests/
    - docs/
    - docker/secrets/*.example
    - docker/.env.example
    - examples/
    - .gitleaksignore
    # Agent skill/config dirs contain example AWS credential configs for documentation
    - .claude/
    - .codex/
    - .gemini/
    # Config files reference fake patterns as allowlist entries — not real credentials
    - .gitguardian.yaml
    - .gitleaks.toml
    - .gitallowed
    # detect-secrets baseline: stores SHA1 hashes of known-fake patterns (not real secrets)
    - .secrets.baseline
    # Third-party container sources — minified JS identifiers are not credentials
    - oneclaw-container/

  ignored-matches:
    # Fake/example patterns already allow-listed in .gitleaks.toml
    - match: "sk-example-not-a-real-key"
      name: "synthetic OpenAI-shaped test fixture"
    - match: "AKIAIOSFODNN7EXAMPLE"
      name: "AWS public documentation example key"
    - match: "AKIAI44QH8DHBEXAMPLE"
      name: "AWS public documentation example key (second variant)"
    - match: "ghp_EXAMPLEFAKETOKENabcdefghijklmnopqrst"
      name: "synthetic GitHub PAT test fixture"
    - match: "0000000001:AAFakeTokenXXXXXXXXXXXXXXXXXXXXXXXX"
      name: "synthetic Telegram bot token test fixture"
    - match: "A3-XXXXXX"
      name: "synthetic 1Password secret key placeholder"
    - match: "EXAMPLE_PAYLOAD.EXAMPLE_SIGNATURE"
      name: "synthetic JWT test fixture"
    - match: "EXAMPLE_CANARY_VALUE"
      name: "synthetic canary test fixture"
    - match: "GOCSPX-EXAMPLE"
      name: "synthetic Google OAuth test fixture"
    - match: "YOUR_GATEWAY_PASSWORD_HERE"
      name: "gateway password placeholder"
    - match: "sk-proj-abc123"
      name: "synthetic OpenAI-style key in log-sanitizer test fixture"
    - match: "sk-1234567890abcdef"
      name: "synthetic OpenAI-style key in historical log-sanitizer test fixture"
    - match: "sk-abcdef1234567890"
      name: "synthetic OpenAI-style key in historical log-sanitizer test fixture"
    - match: "aW1hZ2VwdWxsOnBsYWNlaG9sZGVy"
      name: "base64 of 'imagepull:placeholder' — fake Docker registry auth for CIS compliance scorer"
    - match: "YOUR_TOKEN"
      name: "documentation placeholder in curl examples — not a real credential"
    - match: "sk-abcdef1234567890abcdef1234567890"
      name: "synthetic OpenAI-style key in historical log-sanitizer test fixture (full value)"
    - match: "***REVOKED-"
      name: "git-filter-repo Phase B/C/D replacement marker — not a real credential"
    - match: "REVOKED-GATEWAY-TOKEN"
      name: "git-filter-repo Phase D replacement marker — not a real credential"
